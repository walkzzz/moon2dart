name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Update registry index
        run: moon update
      - name: Check (all targets, deny warnings)
        run: moon check --target all --deny-warn
      - name: Test (all targets)
        run: moon test --target all
      - name: Format check
        run: moon fmt --check
      - name: Verify API interface (.mbti contract)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Code coverage report
        run: |
          moon test --enable-coverage --target native
          moon coverage analyze | tee coverage.txt
          grep -q "uncovered line" coverage.txt

  golden-dual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update registry index
        run: moon update
      - name: Golden dual-runtime comparison (arithmetic 14 + business 13)
        run: node scripts/golden_check.mjs
      - name: Dart analyzer on generated code
        run: dart analyze golden_out --fatal-infos
      - name: Dart formatter can parse generated code
        run: dart format --output=none golden_out
      - name: Safety boundary gate (fail-closed / report / idempotence / collection equality)
        run: node scripts/safety_gate.mjs
      - name: Acceptance report on real sources (fail-closed subset coverage)
        run: node scripts/acceptance_report.mjs
      - name: Upload safety & acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moon2dart-evidence
          path: |
            golden_out/safety.json
            golden_out/safety.md
            docs/golden_results.md
            docs/golden_results_business.md
            docs/acceptance_report.md