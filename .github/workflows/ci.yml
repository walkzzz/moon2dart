name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Update registry index
        run: moon update
      - name: Check (all targets, deny warnings)
        run: moon check --target all --deny-warn
      - name: Test (all targets)
        run: moon test --target all
      - name: Format check
        run: moon fmt --check
      - name: Verify API interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti' || echo "Warning: .mbti files changed, please commit them"
      - name: Code coverage report
        run: |
          moon test --enable-coverage --target native
          moon coverage analyze | tee coverage.txt

  golden-dual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update registry index
        run: moon update
      - name: Golden dual-runtime comparison (MoonBit truth vs Dart execution, 14/14)
        run: node scripts/golden_check.mjs
