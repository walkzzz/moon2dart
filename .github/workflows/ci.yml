name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        # 固定版本：本地开发验证所用版本，避免 latest 版本漂移导致 fmt/check 规则变化
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.1.20261117
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Update registry index
        run: moon update
      - name: Check (all targets, deny warnings)
        run: moon check --target all --deny-warn
      - name: Test (all targets)
        run: moon test --target all
      - name: Format check
        run: moon fmt --check
      - name: Verify API interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti' || echo "Warning: .mbti files changed, please commit them"
      - name: Code coverage report
        run: |
          moon test --enable-coverage --target native
          moon coverage analyze | tee coverage.txt
